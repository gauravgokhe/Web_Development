<!DOCTYPE html>
<html lang="hi">
<head>
  <title>Table Layout Example</title>
</head>
<body>
  <h1>Table-based Layout</h1>
  <hr>
  <table border="1" width="80%" align="center" cellpadding="10">
    <caption><b>Student Information Table</b></caption>
    <tr align="center">
      <th rowspan="2">Roll No</th>
      <th colspan="2">Name</th>
      <th rowspan="2">Course</th>
    </tr>
    <tr align="center">
      <th>First Name</th>
      <th>Last Name</th>
    </tr>
    <tr align="center">
      <td>101</td>
      <td>Prem</td>
      <td>Kumar</td>
      <td>AI & ML</td>
    </tr>
    <tr align="center">
      <td>102</td>
      <td>Riya</td>
      <td>Sharma</td>
      <td>Web Dev</td>
    </tr>
    <tr align="center">
      <td colspan="4"><b>End of Student List</b></td>
    </tr>
  </table>
</body>
</html>
