<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Div and Span Layout</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }
    .container{
      width: 80%;
      margin: 20px auto;
      background: white;
      border: 2px solid #0078d7;
      border-radius: 8px;
      padding: 15px;
    }
    .header{
      background-color: #0078d7;
      color: white;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
    }
    .content{
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
    }
    .box{
      width: 48%; background-color: #e8f4ff;
      padding: 10px; border-radius: 6px;
      border-left: 4px solid #0078d7;
    }
    .highlight{
      color: #d9534f;
      font-weight: bold;
    }
    .footer{
      text-align: center; background: #333;
      color: white; padding: 8px;
      margin-top: 15px; border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Web Page Using Div and Span</h2>
    </div>

    <div class="content">
      <div class="box">
        <p>This is the <span class="highlight">left section</span> of the layout made with div elements.</p>
      </div>
      <div class="box">
        <p>This is the <span class="highlight">right section</span> showing text styled using span tag.</p>
      </div>
    </div>

    <div class="footer">
      <p>&copy; 2025 Web Development Lab | Gaurav Gokhe</p>
    </div>
  </div>
</body>
</html>
