<!DOCTYPE html>
<html lang="eng">
<head>
  <title>Box Model & Background Example</title>
  <style>
    body {
      background-image: url(bg2.jpg);
      background-repeat: no-repeat;
      background-size: cover;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: rgb(255, 255, 255);
      background-color: rgba(0, 0, 0, 0.571);
      padding: 10px;
      border-radius: 10px;
    }
    section {
      width: 350px;
      background-color: #ffffff;
      border: 4px solid #007acc;
      padding: 20px;        /* space inside the box */
      margin: 40px auto;    /* space outside the box */
      border-radius: 10px;
      box-shadow: 0 0 10px gray;
    }
    h2 {
      text-align: center;
      color: #007acc;
      text-decoration: underline;
    }
    p {
      color: #333;
      text-align: justify;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>Advanced CSS: Box Model Example</h1>
  <section>
    <h2>What is Box Model?</h2>
    <p>In CSS, every element is treated as a rectangular box.  
      The <b>Box Model</b> consists of <b>content, padding, border,</b> and <b>margin.</b>
    </p>
    <p>
      <b>Padding</b> gives space inside the box,  
      <b>Border</b> covers the padding and content,  
      and <b>Margin</b> adds space outside the box.
    </p>
  </section>
</body>
</html>
