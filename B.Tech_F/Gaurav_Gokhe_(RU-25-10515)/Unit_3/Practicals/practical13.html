<!DOCTYPE html>
<html>
<head>
    <title>Functions & Scope</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        button { margin: 6px; padding: 8px 12px; }
        #output { margin-top: 15px; white-space: pre-line; font-weight: bold; }
    </style>
</head>
<body>

<h2>Functions & Scope</h2>

<button onclick="callFunction()">Call Function</button>
<button onclick="showScope()">Show Scope</button>

<p id="output">Output: —</p>

<script>

    // Simple user-defined function
    let name = prompt("Your Name")
    function greet() {
        
        return "Hello " + name + "!"+"Welcome To JavaScript.";
    }

    // A function calling another function
    function callFunction() {
        let message = greet("Kucchu");  
        document.getElementById("output").textContent = 
            "Function Output:\n" + message;
    }

    // Scope demonstration
    function showScope() {
        var x = 10;   // function scoped
        let y = 20;   // block scoped
        const z = 30; // constant

        if (true) {
            var x = 99;  // overwrites x (var = function scope)
            let y = 50;  // new y only inside block
        }

        let text = "";
        text += "var x (after block): " + x + "\n";   // 99  
        text += "let y (after block): " + y + "\n";   // 20  
        text += "const z: " + z;                      // 30

        document.getElementById("output").textContent = 
            "Scope Output:\n" + text;
    }

</script>

</body>
</html>
