<!DOCTYPE html>
<html>
<head>
    <title>Simple Canvas</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        canvas { border: 1px solid #333; margin-top: 10px; background-color: aliceblue;}
        button { margin: 5px; padding: 8px 12px; }
    </style>
</head>
<body>

<h2>Canvas Drawing</h2>

<button onclick="drawRect()">Rectangle</button>
<button onclick="drawCircle()">Circle</button>
<button onclick="clearCanvas()">Clear</button>

<canvas id="myCanvas" width="400" height="250"></canvas>

<script>
let c = document.getElementById("myCanvas");
let ctx = c.getContext("2d");

function drawRect() {
    ctx.fillStyle = "lightblue";
    ctx.fillRect(50, 40, 150, 80);
}

function drawCircle() {
    ctx.beginPath();
    ctx.arc(250, 120, 40, 0, Math.PI * 2);
    ctx.fillStyle = "pink";
    ctx.fill();
}

function clearCanvas() {
    ctx.clearRect(0, 0, c.width, c.height);
}
</script>

</body>
</html>
