<!DOCTYPE html>
<html>
<head>
    <title>Toggle Class</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        #box { padding: 15px; border: 1px solid #000; width: 250px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<h2>Toggle Class</h2>

<button onclick="toggleBox()">Show / Hide Box</button>

<div id="box">
    This box can be shown or hidden using classList.toggle().
</div>

<script>
function toggleBox() {
    document.getElementById("box").classList.toggle("hidden");
}
</script>

</body>
</html>
