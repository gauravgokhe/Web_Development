<!DOCTYPE html>
<html>
<head>
    <title>Conditions & Loops</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        button { margin: 6px; padding: 8px 12px; }
        #output { margin-top: 15px; white-space: pre-line; font-weight: bold; }
    </style>
</head>
<body>

<h2>Conditional Statements & Loops</h2>

<button onclick="demoIf()">IF Condition</button>
<button onclick="demoFor()">FOR Loop</button>
<button onclick="demoWhile()">WHILE Loop</button>
<button onclick="demoDoWhile()">DO-WHILE Loop</button>

<p id="output">Output: —</p>

<script>

    function demoIf() {
        let num = prompt("Enter A Number"); // fixed example number
        let msg = "";

        if (num > 5) {
            msg = "Number is greater than 5";
        } else {
            msg = "Number is 5 or less";
        }

        document.getElementById("output").textContent = "IF Condition:\n" + msg;
    }

    function demoFor() {
        let num = prompt("Print All The Numbers From 1 to that Entered number");
        let text = "FOR Loop:\n";
        for (let i = 1; i <= num; i++) {
            text += i + " ";
        }
        document.getElementById("output").textContent = text;
    }

    function demoWhile() {
        let n1=prompt("Print All The Numbers From the Entered number to 1")
        let text = "WHILE Loop:\n";
        let i = n1;
        while (i >= 1) {
            text += i + " ";
            i--;
        }
        document.getElementById("output").textContent = text;
    }

    function demoDoWhile() {
        let text = "DO-WHILE Loop:\n";
        let i = 1;
        do {
            text += i + " ";
            i++;
        } while (i <= 3);

        document.getElementById("output").textContent = text;
    }
</script>

</body>
</html>
