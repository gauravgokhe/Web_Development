<!DOCTYPE html>
<html>
<head>
    <title>Arithmetic Operations</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        input { margin: 8px 0; padding: 6px; }
        button { margin: 5px; padding: 6px 12px; }
        #result { margin-top: 12px; font-weight: bold; }
    </style>
</head>
<body>

<h2>Basic Arithmetic Operations</h2>

<input type="number" id="num1" placeholder="Enter number 1"><br>
<input type="number" id="num2" placeholder="Enter number 2"><br>

<button onclick="add()">+</button>
<button onclick="sub()">-</button>
<button onclick="mul()">*</button>
<button onclick="div()">/</button>

<p id="result">Result: —</p>

<script>
    function add() {
        let a = Number(document.getElementById("num1").value);
        let b = Number(document.getElementById("num2").value);
        document.getElementById("result").textContent = "Result: " + (a + b);
    }

    function sub() {
        let a = Number(document.getElementById("num1").value);
        let b = Number(document.getElementById("num2").value);
        document.getElementById("result").textContent = "Result: " + (a - b);
    }

    function mul() {
        let a = Number(document.getElementById("num1").value);
        let b = Number(document.getElementById("num2").value);
        document.getElementById("result").textContent = "Result: " + (a * b);
    }

    function div() {
        let a = Number(document.getElementById("num1").value);
        let b = Number(document.getElementById("num2").value);

        if (b === 0) {
            document.getElementById("result").textContent = "Result: Cannot divide by zero";
            return;
        }

        document.getElementById("result").textContent = "Result: " + (a / b);
    }
</script>

</body>
</html>
